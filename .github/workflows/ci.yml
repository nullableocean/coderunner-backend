name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Actions Checkout
      uses: actions/checkout@v3

    - name: Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set Up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Env
      run: cp .env.example .env && cp ./codeprocessor/.env.example ./codeprocessor/.env
      
    - name: Build all
      run: make build-all

    - name: Tests
      run: make tests
